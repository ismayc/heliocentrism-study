<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 360 944.05" role="img" aria-label="How a basket is credited and how one game&#x27;s credit becomes shares"><title>How a basket is credited and how one game&#x27;s credit becomes shares</title><defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><text x="12" y="28" font-size="17" class="dg-f-ink dg-display" font-weight="600">1. Credit each made basket to one creator</text><rect x="12" y="42" width="336" height="132" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1.5"/><text x="24" y="66" font-size="14" class="dg-f-nba dg-text" font-weight="700">Assisted make</text><text x="24" y="92" font-size="13" class="dg-f-ink dg-text">A. Edwards makes a three,</text><text x="24" y="110.2" font-size="13" class="dg-f-ink dg-text">assisted by J. McDaniels</text><rect x="24" y="136" width="312" height="26" class="dg-f-nba" rx="13"/><text x="180" y="154" font-size="13" class="dg-f-surface dg-text" text-anchor="middle" font-weight="600">+3 points to J. McDaniels, the passer</text><rect x="12" y="184" width="336" height="132" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1.5"/><text x="24" y="208" font-size="14" class="dg-f-ink2 dg-text" font-weight="700">Unassisted make</text><text x="24" y="234" font-size="13" class="dg-f-ink dg-text">R. Gobert makes a two,</text><text x="24" y="252.2" font-size="13" class="dg-f-ink dg-text">with no assist recorded</text><rect x="24" y="278" width="312" height="26" class="dg-f-ink3" rx="13"/><text x="180" y="296" font-size="13" class="dg-f-surface dg-text" text-anchor="middle" font-weight="600">+2 points to R. Gobert, the shooter</text><text x="12" y="356" font-size="17" class="dg-f-ink dg-display" font-weight="600">2. Add up one game: MIN at MIA,</text><text x="12" y="378.95" font-size="17" class="dg-f-ink dg-display" font-weight="600">January 3, 2026</text><rect x="12" y="388.95" width="12" height="12" class="dg-f-nba" rx="2"/><text x="30" y="398.95" font-size="12" class="dg-f-ink2 dg-text">own unassisted makes</text><rect x="176" y="388.95" width="12" height="12" class="dg-f-nba" rx="2" opacity="0.4"/><text x="194" y="398.95" font-size="12" class="dg-f-ink2 dg-text">assists to teammates</text><text x="116" y="429.27" font-size="12" class="dg-f-ink dg-text" text-anchor="end" font-weight="700">A. Edwards</text><rect x="122" y="416.95" width="78.8889" height="16" class="dg-f-nba" rx="2"/><rect x="200.889" y="416.95" width="63.1111" height="16" class="dg-f-nba" rx="2" opacity="0.4"/><text x="270" y="429.27" font-size="12" class="dg-f-ink2 dg-text">27 (26.2%)</text><text x="116" y="453.27" font-size="12" class="dg-f-ink dg-text" text-anchor="end">J. Randle</text><rect x="122" y="440.95" width="47.3333" height="16" class="dg-f-nba" rx="2"/><rect x="169.333" y="440.95" width="57.8519" height="16" class="dg-f-nba" rx="2" opacity="0.4"/><text x="233.185" y="453.27" font-size="12" class="dg-f-ink2 dg-text">20 (19.4%)</text><text x="116" y="477.27" font-size="12" class="dg-f-ink dg-text" text-anchor="end">D. DiVincenzo</text><rect x="122" y="464.95" width="36.8148" height="16" class="dg-f-nba" rx="2"/><rect x="158.815" y="464.95" width="42.0741" height="16" class="dg-f-nba" rx="2" opacity="0.4"/><text x="206.889" y="477.27" font-size="12" class="dg-f-ink2 dg-text">15 (14.6%)</text><text x="116" y="501.27" font-size="12" class="dg-f-ink dg-text" text-anchor="end">N. Reid</text><rect x="122" y="488.95" width="21.037" height="16" class="dg-f-nba" rx="2"/><rect x="143.037" y="488.95" width="31.5556" height="16" class="dg-f-nba" rx="2" opacity="0.4"/><text x="180.593" y="501.27" font-size="12" class="dg-f-ink2 dg-text">10 (9.7%)</text><text x="116" y="525.27" font-size="12" class="dg-f-ink dg-text" text-anchor="end">J. McDaniels</text><rect x="122" y="512.95" width="10.5185" height="16" class="dg-f-nba" rx="2"/><rect x="132.519" y="512.95" width="42.0741" height="16" class="dg-f-nba" rx="2" opacity="0.4"/><text x="180.593" y="525.27" font-size="12" class="dg-f-ink2 dg-text">10 (9.7%)</text><text x="116" y="549.27" font-size="12" class="dg-f-ink dg-text" text-anchor="end">B. Hyland</text><rect x="122" y="536.95" width="10.5185" height="16" class="dg-f-nba" rx="2"/><rect x="132.519" y="536.95" width="36.8148" height="16" class="dg-f-nba" rx="2" opacity="0.4"/><text x="175.333" y="549.27" font-size="12" class="dg-f-ink2 dg-text">9 (8.7%)</text><text x="116" y="573.27" font-size="12" class="dg-f-ink dg-text" text-anchor="end">M. Conley</text><rect x="122" y="560.95" width="31.5556" height="16" class="dg-f-nba" rx="2" opacity="0.4"/><text x="159.556" y="573.27" font-size="12" class="dg-f-ink2 dg-text">6 (5.8%)</text><text x="116" y="597.27" font-size="12" class="dg-f-ink dg-text" text-anchor="end">R. Gobert</text><rect x="122" y="584.95" width="21.037" height="16" class="dg-f-nba" rx="2"/><rect x="143.037" y="584.95" width="10.5185" height="16" class="dg-f-nba" rx="2" opacity="0.4"/><text x="159.556" y="597.27" font-size="12" class="dg-f-ink2 dg-text">6 (5.8%)</text><rect x="12" y="622.95" width="336" height="236" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1.5"/><text x="26" y="648.95" font-size="13" class="dg-f-ink dg-text">Created points in the game: 103</text><text x="26" y="680.95" font-size="13" class="dg-f-ink2 dg-text">Top creator&#x27;s share</text><text x="26" y="706.95" font-size="18" class="dg-f-nba dg-text" font-weight="700">27 / 103 = 26.2%</text><text x="26" y="740.95" font-size="13" class="dg-f-ink2 dg-text">Effective number of creators</text><text x="26" y="762.95" font-size="12" class="dg-f-ink2 dg-text">1 / sum of squared shares</text><text x="26" y="790.95" font-size="18" class="dg-f-nba dg-text" font-weight="700">1 / 0.161 = 6.21</text><text x="26" y="816.95" font-size="12" class="dg-f-ink3 dg-text" font-style="italic">equal creators would give the same</text><text x="26" y="833.15" font-size="12" class="dg-f-ink3 dg-text" font-style="italic">concentration</text><text x="12" y="892.95" font-size="13" class="dg-f-ink2 dg-text">3. Repeat for every game. A team&#x27;s measure is</text><text x="12" y="910.5" font-size="13" class="dg-f-ink2 dg-text">the average over its games, and a season&#x27;s</text><text x="12" y="928.05" font-size="13" class="dg-f-ink2 dg-text">league value is the average over its teams.</text></svg>
