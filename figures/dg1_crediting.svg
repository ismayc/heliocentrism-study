<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 760 548.25" role="img" aria-label="How a basket is credited and how one game&#x27;s credit becomes shares"><title>How a basket is credited and how one game&#x27;s credit becomes shares</title><defs><marker id="dg-arrow-9d7de57c87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><text x="12" y="28" font-size="20" class="dg-f-ink dg-display" font-weight="600">1. Credit each made basket to one creator</text><rect x="12" y="42" width="362" height="140" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1.5"/><text x="24" y="66" font-size="16" class="dg-f-nba dg-text" font-weight="700">Assisted make</text><text x="24" y="92" font-size="15" class="dg-f-ink dg-text">A. Edwards makes a three,</text><text x="24" y="113" font-size="15" class="dg-f-ink dg-text">assisted by J. McDaniels</text><rect x="24" y="144" width="338" height="26" class="dg-f-nba" rx="13"/><text x="193" y="162" font-size="15" class="dg-f-surface dg-text" text-anchor="middle" font-weight="600">+3 points to J. McDaniels, the passer</text><rect x="386" y="42" width="362" height="140" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1.5"/><text x="398" y="66" font-size="16" class="dg-f-ink2 dg-text" font-weight="700">Unassisted make</text><text x="398" y="92" font-size="15" class="dg-f-ink dg-text">R. Gobert makes a two,</text><text x="398" y="113" font-size="15" class="dg-f-ink dg-text">with no assist recorded</text><rect x="398" y="144" width="338" height="26" class="dg-f-ink3" rx="13"/><text x="567" y="162" font-size="15" class="dg-f-surface dg-text" text-anchor="middle" font-weight="600">+2 points to R. Gobert, the shooter</text><text x="12" y="222" font-size="20" class="dg-f-ink dg-display" font-weight="600">2. Add up one game: MIN at MIA, January 3, 2026</text><rect x="12" y="232" width="12" height="12" class="dg-f-nba" rx="2"/><text x="30" y="242" font-size="14" class="dg-f-ink2 dg-text">own unassisted makes</text><rect x="198" y="232" width="12" height="12" class="dg-f-nba" rx="2" opacity="0.4"/><text x="216" y="242" font-size="14" class="dg-f-ink2 dg-text">assists to teammates</text><text x="132" y="273.68" font-size="14" class="dg-f-ink dg-text" text-anchor="end" font-weight="700">A. Edwards</text><rect x="138" y="260" width="122.222" height="18" class="dg-f-nba" rx="2"/><rect x="260.222" y="260" width="97.7778" height="18" class="dg-f-nba" rx="2" opacity="0.4"/><text x="364" y="273.68" font-size="14" class="dg-f-ink2 dg-text">27 (26.2%)</text><text x="132" y="299.68" font-size="14" class="dg-f-ink dg-text" text-anchor="end">J. Randle</text><rect x="138" y="286" width="73.3333" height="18" class="dg-f-nba" rx="2"/><rect x="211.333" y="286" width="89.6296" height="18" class="dg-f-nba" rx="2" opacity="0.4"/><text x="306.963" y="299.68" font-size="14" class="dg-f-ink2 dg-text">20 (19.4%)</text><text x="132" y="325.68" font-size="14" class="dg-f-ink dg-text" text-anchor="end">D. DiVincenzo</text><rect x="138" y="312" width="57.037" height="18" class="dg-f-nba" rx="2"/><rect x="195.037" y="312" width="65.1852" height="18" class="dg-f-nba" rx="2" opacity="0.4"/><text x="266.222" y="325.68" font-size="14" class="dg-f-ink2 dg-text">15 (14.6%)</text><text x="132" y="351.68" font-size="14" class="dg-f-ink dg-text" text-anchor="end">N. Reid</text><rect x="138" y="338" width="32.5926" height="18" class="dg-f-nba" rx="2"/><rect x="170.593" y="338" width="48.8889" height="18" class="dg-f-nba" rx="2" opacity="0.4"/><text x="225.481" y="351.68" font-size="14" class="dg-f-ink2 dg-text">10 (9.7%)</text><text x="132" y="377.68" font-size="14" class="dg-f-ink dg-text" text-anchor="end">J. McDaniels</text><rect x="138" y="364" width="16.2963" height="18" class="dg-f-nba" rx="2"/><rect x="154.296" y="364" width="65.1852" height="18" class="dg-f-nba" rx="2" opacity="0.4"/><text x="225.481" y="377.68" font-size="14" class="dg-f-ink2 dg-text">10 (9.7%)</text><text x="132" y="403.68" font-size="14" class="dg-f-ink dg-text" text-anchor="end">B. Hyland</text><rect x="138" y="390" width="16.2963" height="18" class="dg-f-nba" rx="2"/><rect x="154.296" y="390" width="57.037" height="18" class="dg-f-nba" rx="2" opacity="0.4"/><text x="217.333" y="403.68" font-size="14" class="dg-f-ink2 dg-text">9 (8.7%)</text><text x="132" y="429.68" font-size="14" class="dg-f-ink dg-text" text-anchor="end">M. Conley</text><rect x="138" y="416" width="48.8889" height="18" class="dg-f-nba" rx="2" opacity="0.4"/><text x="192.889" y="429.68" font-size="14" class="dg-f-ink2 dg-text">6 (5.8%)</text><text x="132" y="455.68" font-size="14" class="dg-f-ink dg-text" text-anchor="end">R. Gobert</text><rect x="138" y="442" width="32.5926" height="18" class="dg-f-nba" rx="2"/><rect x="170.593" y="442" width="16.2963" height="18" class="dg-f-nba" rx="2" opacity="0.4"/><text x="192.889" y="455.68" font-size="14" class="dg-f-ink2 dg-text">6 (5.8%)</text><rect x="470" y="242" width="278" height="236" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1.5"/><text x="484" y="268" font-size="15" class="dg-f-ink dg-text">Created points in the game: 103</text><text x="484" y="300" font-size="15" class="dg-f-ink2 dg-text">Top creator&#x27;s share</text><text x="484" y="326" font-size="20" class="dg-f-nba dg-text" font-weight="700">27 / 103 = 26.2%</text><text x="484" y="360" font-size="15" class="dg-f-ink2 dg-text">Effective number of creators</text><text x="484" y="382" font-size="14" class="dg-f-ink2 dg-text">1 / sum of squared shares</text><text x="484" y="410" font-size="20" class="dg-f-nba dg-text" font-weight="700">1 / 0.161 = 6.21</text><text x="484" y="436" font-size="14" class="dg-f-ink3 dg-text" font-style="italic">equal creators would give the</text><text x="484" y="454.9" font-size="14" class="dg-f-ink3 dg-text" font-style="italic">same concentration</text><text x="12" y="512" font-size="15" class="dg-f-ink2 dg-text">3. Repeat for every game. A team&#x27;s measure is the average over its games, and a season&#x27;s</text><text x="12" y="532.25" font-size="15" class="dg-f-ink2 dg-text">league value is the average over its teams.</text></svg>
