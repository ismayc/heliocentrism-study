" y="262" font-size="18" class="dg-f-nba dg-text" text-anchor="end" font-weight="700">28.5%</text><text x="12" y="288" font-size="15" class="dg-f-ink2 dg-text">Star&#x27;s share of season totals:</text><text x="432" y="288" font-size="18" class="dg-f-ink dg-text" text-anchor="end" font-weight="700">21.0%</text><text x="12" y="314" font-size="14" class="dg-f-ink3 dg-text" font-style="italic">Same star, same role every night; only the missed</text><text x="12" y="332.9" font-size="14" class="dg-f-ink3 dg-text" font-style="italic">games pull the season-total share down.</text><rect x="470" y="8" width="278" height="256" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1.5"/><text x="484" y="34" font-size="16" class="dg-f-ink dg-text" font-weight="700">The real NBA change</text><text x="484" y="56" font-size="14" class="dg-f-ink2 dg-text">1996-97 to 2000-01 against</text><text x="484" y="74.9" font-size="14" class="dg-f-ink2 dg-text">2021-22 to 2025-26, in points</text><text x="484" y="104.9" font-size="15" class="dg-f-ink dg-text" font-weight="600">Season totals</text><rect x="564.36" y="114.9" width="161.64" height="20" class="dg-f-ink3" rx="2" opacity="0.85"/><line x1="508" y1="124.9" x2="620.719" y2="124.9" stroke-width="1.5" class="dg-s-ink"/><line x1="508" y1="118.9" x2="508" y2="130.9" stroke-width="1.5" class="dg-s-ink"/><line x1="620.719" y1="118.9" x2="620.719" y2="130.9" stroke-width="1.5" class="dg-s-ink"/><text x="720" y="104.9" font-size="17" class="dg-f-ink dg-text" text-anchor="end" font-weight="700">-3.9</text><text x="484" y="154.9" font-size="14" class="dg-f-ink3 dg-text">95% interval -5.3 to -2.5</text><text x="484" y="186.9" font-size="15" class="dg-f-ink dg-text" font-weight="600">Per game</text><rect x="684.423" y="196.9" width="41.577" height="20" class="dg-f-nba" rx="2" opacity="0.85"/><line x1="648.369" y1="206.9" x2="720.477" y2="206.9" stroke-width="1.5" class="dg-s-ink"/><line x1="648.369" y1="200.9" x2="648.369" y2="212.9" stroke-width=